# burunner 示例 - 百度搜索测试
# 演示如何使用自然语言描述百度搜索相关的测试用例

# ============================================================
# 预设（公共步骤）
# ============================================================
presets:
  打开百度搜索:
    steps:
      - 访问 https://www.baidu.com
      - 验证页面标题包含 "百度一下"

# ============================================================
# 全局配置
# ============================================================
config:
  llm_provider: openai
  llm_model: gpt-4o
  max_steps: 30
  headless: true

# ============================================================
# 测试用例
# ============================================================
cases:
  # 基础搜索功能
  - name: 百度搜索关键词
    preset: 打开百度搜索
    tags: [smoke, search, p1]
    description: 验证百度搜索基本功能
    steps:
      - 在搜索框输入 "Python 教程"
      - 点击 "百度一下" 按钮
      - 等待搜索结果加载完成
      - 验证搜索结果包含 "Python" 相关内容
      - 验证第一条搜索结果的标题包含 "Python"

  # 搜索建议
  - name: 搜索自动补全
    preset: 打开百度搜索
    tags: [search, p2]
    description: 验证搜索框自动补全功能
    steps:
      - 在搜索框输入 "天气"
      - 等待搜索建议出现
      - 验证搜索建议列表包含至少 3 个选项
      - 验证搜索建议包含 "天气预报"

  # 高级搜索 - 图片搜索
  - name: 百度图片搜索
    preset: 打开百度搜索
    tags: [search, image, p2]
    steps:
      - 在搜索框输入 "风景图片"
      - 点击 "百度一下" 按钮
      - 点击 "图片" 选项卡切换到图片搜索
      - 验证页面显示图片搜索结果
      - 验证至少显示 10 张图片缩略图

  # 多语言搜索
  - name: 英文关键词搜索
    preset: 打开百度搜索
    tags: [search, p3]
    steps:
      - 在搜索框输入 "artificial intelligence"
      - 点击 "百度一下" 按钮
      - 验证搜索结果页面正确加载
      - 验证搜索结果包含英文相关内容

  # 搜索历史（需要先搜索一次）
  - name: 搜索历史显示
    preset: 打开百度搜索
    tags: [search, p3]
    steps:
      - 在搜索框输入 "test keyword"
      - 点击 "百度一下" 按钮
      - 等待页面跳转完成
      - 点击浏览器的后退按钮
      - 验证回到百度搜索首页
      - 验证搜索框下方显示最近搜索历史包含 "test keyword"

  # 错误处理 - 空搜索
  - name: 空关键词搜索
    preset: 打开百度搜索
    tags: [search, p3, edge-case]
    steps:
      - 不输入任何内容，直接点击 "百度一下" 按钮
      - 验证页面保持在百度搜索首页
      - 验证搜索框为空

  # 特殊字符搜索
  - name: 特殊字符搜索
    preset: 打开百度搜索
    tags: [search, p3, edge-case]
    steps:
      - 在搜索框输入 "@#$%&*"
      - 点击 "百度一下" 按钮
      - 验证搜索结果页面正确加载
      - 验证页面显示搜索结果或提示信息

# ============================================================
# 环境变量配置（可选）
# ============================================================
environments:
  dev:
    variables:
      search_keyword: "Python 入门教程"
      expected_result: "Python"
    config:
      headless: false
      max_steps: 50

  staging:
    variables:
      search_keyword: "软件测试"
      expected_result: "测试"
    config:
      headless: true
      max_steps: 40

  prod:
    variables:
      search_keyword: "人工智能"
      expected_result: "AI"
    config:
      headless: true
      max_steps: 30
