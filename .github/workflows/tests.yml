name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Check imports
        run: |
          python -c "from burunner.cli import main; print('✓ CLI import OK')"
          python -c "from burunner.config import RunnerConfig; print('✓ Config import OK')"
          python -c "from burunner.parser.models import TestCase, TestSuite; print('✓ Parser import OK')"
          python -c "from burunner.runner.orchestrator import run_suite; print('✓ Runner import OK')"
      
      - name: Validate example
        run: python -m burunner validate examples/example.yaml

  lint:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8 black isort
      
      - name: Check syntax
        run: |
          python -m py_compile src/burunner/cli.py
          python -m py_compile src/burunner/config.py
          python -m py_compile src/burunner/runner/orchestrator.py
          echo "✓ All files compile successfully"
      
      - name: Run flake8
        run: |
          flake8 src/burunner --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "✓ No critical errors found"
